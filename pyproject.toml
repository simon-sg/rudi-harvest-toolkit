[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rudi-harvest-toolkit"
version = "0.1.0"
description = "Boîte à outils partagée : métadonnées RUDI (pivot), rendu Markdown, état, session HTTP et publication vers un nœud RUDI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "rudi-node-write>=1.4.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
